services:
  # Сервис базы данных MongoDB
  mongodb:
    image: mongo:6
    container_name: smart_home_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: student
      MONGO_INITDB_ROOT_PASSWORD: student_secure_password
      MONGO_INITDB_DATABASE: smart_home
    ports:
      - "27017:27017"                   # Пробрасываем порт для доступа
    volumes:
      - smart_home_mongo:/data/db  # Постоянное хранилище данных
    networks:
      - smart_home_network            # Сеть для связи с приложением
    healthcheck:
      # Проверка готовности базы данных к работе
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s                   # Проверяем каждые 10 секунд
      timeout: 5s                     # Таймаут проверки
      retries: 5                      # Количество попыток

  # Сервис Redis
  redis:
    image: redis:7-alpine
    container_name: smart_home_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - smart_home_redis:/data
    networks:
      - smart_home_network
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Сервис приложения (Development с документацией)
  app:
    build: .                          # Собираем из Dockerfile в текущей директории
    container_name: smart_home_app
    restart: unless-stopped
    environment:
      DB_HOST: mongodb
      DB_PORT: 27017
      DB_USER: student
      DB_PASSWORD: student_secure_password
      DB_NAME: smart_home
      MONGO_URI: mongodb://${DB_USER}:${DB_PASSWORD}@mongodb:27017/${DB_NAME}?authSource=admin
      APP_ENV: development
      JWT_ACCESS_SECRET: your_super_secret_access_key_12345
      JWT_REFRESH_SECRET: your_super_secret_refresh_key_67890
      JWT_ACCESS_EXPIRATION: 15
      JWT_REFRESH_EXPIRATION: 10080
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
      YANDEX_CALLBACK_URL: ${YANDEX_CALLBACK_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      CACHE_TTL_DEFAULT: 300
    ports:
      - "4200:4200"                   # Пробрасываем порт приложения
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app                # Монтируем код для разработки
    networks:
      - smart_home_network
    
    # Команда запуска: сначала миграции, потом приложение
    command: >
      sh -c "python -m app.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 4200 --reload"

# Определяем том для постоянного хранения данных БД
volumes:
  smart_home_mongo:
  smart_home_redis:

# Определяем сеть для взаимодействия сервисов
networks:
  smart_home_network: