services:
  mongodb:
    image: mongo:6
    container_name: smart_home_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: student
      MONGO_INITDB_ROOT_PASSWORD: student_secure_password
      MONGO_INITDB_DATABASE: smart_home
    ports:
      - "27017:27017"
    volumes:
      - smart_home_mongo:/data/db
    networks:
      - smart_home_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart_home_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - smart_home_redis:/data
    networks:
      - smart_home_network
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: smart_home_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - smart_home_minio:/data
    networks:
      - smart_home_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: smart_home_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"   # AMQP протокол
      - "15672:15672" # Management UI
    volumes:
      - smart_home_rabbitmq:/var/lib/rabbitmq
    networks:
      - smart_home_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smart_home_app
    restart: unless-stopped
    environment:
      DB_HOST: mongodb
      DB_PORT: 27017
      DB_USER: student
      DB_PASSWORD: student_secure_password
      DB_NAME: smart_home
      MONGO_URI: mongodb://student:student_secure_password@mongodb:27017/smart_home?authSource=admin
      APP_ENV: development
      JWT_ACCESS_SECRET: your_super_secret_access_key_12345
      JWT_REFRESH_SECRET: your_super_secret_refresh_key_67890
      JWT_ACCESS_EXPIRATION: 15
      JWT_REFRESH_EXPIRATION: 10080
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
      YANDEX_CALLBACK_URL: ${YANDEX_CALLBACK_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      CACHE_TTL_DEFAULT: 300
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-smart-home-files}
      MINIO_USE_SSL: "false"
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      ALLOWED_IMAGE_TYPES: ${ALLOWED_IMAGE_TYPES:-image/jpeg,image/png,image/jpg}
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      # Настройки очередей
      QUEUE_USER_REGISTERED: ${QUEUE_USER_REGISTERED:-wp.auth.user.registered}
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      # Настройки очередей
    ports:
      - "4200:4200"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    networks:
      - smart_home_network
    command: >
      sh -c "sleep 5 &&
             python -m app.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 4200 --reload"

volumes:
  smart_home_mongo:
  smart_home_redis:
  smart_home_minio:
  smart_home_rabbitmq:

networks:
  smart_home_network: