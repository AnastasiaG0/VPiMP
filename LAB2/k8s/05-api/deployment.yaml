apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: smart-home
  labels:
    app: api
    version: v1
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
      version: v1
  template:
    metadata:
      labels:
        app: api
        version: v1
        component: backend
    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: api

          image: smart-home/api:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4200
              name: http
              protocol: TCP

          envFrom:
            - configMapRef:
                name: api-config
                optional: false

          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: MONGO_URI
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JWT_REFRESH_SECRET
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: REDIS_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: MINIO_SECRET_KEY
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: RABBITMQ_PASS
            - name: YANDEX_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: YANDEX_CLIENT_ID
            - name: YANDEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: YANDEX_CLIENT_SECRET
            - name: YANDEX_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: YANDEX_CALLBACK_URL
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: SMTP_HOST
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: SMTP_PASS
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: SMTP_FROM

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
              subPath: tmp
            - name: logs
              mountPath: /app/logs
              subPath: logs

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
            medium: Memory
        - name: logs
          emptyDir:
            sizeLimit: 200Mi
